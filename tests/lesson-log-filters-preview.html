<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수업일지 필터 검증</title><link rel="stylesheet" href="../lesson-log-editor.css"><style>body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:#f8fafc}.qa{padding:12px;background:#1e293b;color:white;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.qa button{padding:10px}.qa output{font-size:12px}</style><div class="qa"><span>가상 데이터 · 운영 연결 없음</span><button id="role">강사로 전환</button><output id="scope"></output></div><script>
const teachers=[{uid:'qa-admin-filters',name:'가상 관리자',subject:'데스크'},{uid:'t-kor',name:'가상 국어 강사',subject:'국어'},{uid:'t-eng',name:'가상 영어 강사',subject:'영어'},{uid:'t-math',name:'가상 수학 강사',subject:'수학'},{uid:'t-sci',name:'가상 과학 강사',subject:'물리'},{uid:'t-social',name:'가상 사회 강사',subject:'한국사'}];
const rows=['draft','submitting','submitted','sync_failed','archived'].map((status,i)=>({id:'10000000-0000-4000-8000-'+String(i).padStart(12,'0'),ownerUid:teachers[i+1].uid,teacherName:teachers[i+1].name,studentName:'가상 학생',studentId:'student',status,title:'함수의 그래프와 개념 복습 '+(i+1),lessonDate:'2026-09-29',lessonType:'개별정규',updatedAt:new Date().toISOString(),content:{studentId:'student',title:'가상 수업',lessonDate:'2026-09-29',lessonType:'개별정규',content:'가상 내용',attachmentIds:[]},files:[]}));
window.lessonLogTestAdapter={uid:'qa-admin-filters',async api(action,b={}){await new Promise(r=>setTimeout(r,120));const admin=this.uid==='qa-admin-filters';if(action==='init')return {actor:{uid:this.uid,admin,name:admin?'가상 관리자':'가상 수학 강사'},teachers:admin?teachers:[],students:[{studentId:'student',name:'가상 학생',school:'가상고',grade:'1학년'}],lessonTypes:['개별정규']};if(action==='list'||action==='syncQueue'){document.querySelector('#scope').textContent=`${action} · ${b.ownerUid||'전체'} · ${b.status||'전체 상태'}`;return {rows:rows.filter(r=>(admin?!b.ownerUid||r.ownerUid===b.ownerUid:r.ownerUid===this.uid)&&(!b.status||r.status===b.status)&&(action!=='syncQueue'||['submitting','sync_failed'].includes(r.status))),cursor:null};}if(action==='get')return rows.find(r=>r.id===b.id);if(action==='tracking'){const owner=admin?b.ownerUid:this.uid;document.querySelector('#scope').textContent=`${b.view} · ${owner||'전체'}`;const list=teachers.filter(t=>t.uid!=='qa-admin-filters'&&(!owner||owner===t.uid));return {source:'connected',lastSyncedAt:new Date().toISOString(),rows:list.map((t,i)=>({id:'lesson'+i,teacherName:t.name,teacherUid:t.uid,studentName:'가상 학생',studentId:'student',studentSchool:'가상고',classDate:'2026-09-29',start:'17:00',end:'18:00',status:'missing',minutes:60,subject:t.subject})),history:list.map((t,i)=>({id:'page'+i,title:'가상 수업 기록',teacherName:t.name,studentName:'가상 학생',classDate:'2026-09-29'}))};}return {};}};
document.querySelector('#role').onclick=function(){lessonLogTestAdapter.uid=lessonLogTestAdapter.uid==='qa-admin-filters'?'t-math':'qa-admin-filters';this.textContent=lessonLogTestAdapter.uid==='qa-admin-filters'?'강사로 전환':'관리자로 전환';openPortalLessonLogs();};
</script><script src="../lesson-log-editor.js"></script><script>openPortalLessonLogs();</script></html>
