<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미전송 관리 검증</title><link rel="stylesheet" href="../lesson-log-editor.css"><style>body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:#f8fafc}.qa{padding:12px;background:#1e293b;color:white}.qa button{padding:10px;margin:4px}</style><div class="qa">가상 데이터 · 운영 전송 없음 <button id="role">강사로 전환</button><button id="reset">실패 목록 복원</button><button id="fail">조회 오류 켜기</button></div><script>
const seed=()=>Array.from({length:45},(_,i)=>({id:'00000000-0000-4000-8000-'+String(i).padStart(12,'0'),ownerUid:i%2?'qa-b':'qa-a',teacherName:i%2?'가상 강사 나':'가상 강사 가',studentName:'가상 학생 '+(i+1),title:(i===0?'긴 제목으로 확인하는 수업일지 전송 실패 후 안전한 원본 보존과 재처리 검증':`수학 ${i+1}회차 수업`),lessonDate:'2026-09-29',status:i===1?'submitting':'sync_failed',lastError:i===1?'NOTION_RATE_LIMITED':i===2?'NOTION_RESULT_UNCERTAIN':'NOTION_ID_PROPERTY_MISSING',attempts:2,nextAttemptAt:i===1?Date.now()+60000:0,submittedAt:new Date().toISOString(),updatedAt:new Date().toISOString(),content:{studentId:'student',lessonDate:'2026-09-29',lessonType:'개별정규',title:'가상 수업',content:'가상 내용',attachmentIds:[]},files:[]}));
let rows=seed(),fail=false;
window.lessonLogTestAdapter={uid:'qa-admin',async api(action,b={}){await new Promise(r=>setTimeout(r,100));if(action==='init')return {actor:{uid:this.uid,admin:this.uid==='qa-admin',name:'가상 관리자'},students:[],teachers:[{uid:'qa-a',name:'가상 강사 가'},{uid:'qa-b',name:'가상 강사 나'}],lessonTypes:['개별정규']};if(action==='list')return {rows:[],cursor:null};if(action==='get')return rows.find(r=>r.id===b.id);if(action==='syncQueue'){if(fail)throw Error('가상 네트워크 오류');let found=rows.filter(r=>['sync_failed','submitting'].includes(r.status)&&(!b.status||r.status===b.status)&&(!b.ownerUid||r.ownerUid===b.ownerUid));if(b.cursor)found=found.slice(found.findIndex(r=>r.id===b.cursor)+1);return {rows:found.slice(0,40),cursor:found.length>40?found[39].id:null};}if(action==='retryBatch')return {results:b.ids.map((id,i)=>{const r=rows.find(r=>r.id===id);if(i===1)return {id,error:'RETRY_FAILED'};r.status='submitting';return {id,status:'submitting',queued:true};})};return {};}};
document.querySelector('#role').onclick=function(){lessonLogTestAdapter.uid=lessonLogTestAdapter.uid==='qa-admin'?'qa-teacher':'qa-admin';this.textContent=lessonLogTestAdapter.uid==='qa-admin'?'강사로 전환':'관리자로 전환';openPortalLessonLogs();};document.querySelector('#reset').onclick=()=>{rows=seed();openPortalLessonLogs();};document.querySelector('#fail').onclick=function(){fail=!fail;this.textContent=fail?'조회 오류 끄기':'조회 오류 켜기';};
</script><script src="../lesson-log-editor.js"></script><script>openPortalLessonLogs();</script></html>
